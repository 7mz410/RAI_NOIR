#stick.on .base,#stick.on .knob{display:block}
#stick.live .base,#stick.live .knob{display:block}

#rotate{display:none;position:fixed;inset:0;background:var(--void);z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:9px;line-height:2;color:var(--chrome)}

function tone(f0,f1,dur,type='square',vol=.2,delay=0){ if(!AC) return; const t=AC.currentTime+delay; const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(master); o.start(t); o.stop(t+dur+.03); }
function noise(dur,freq,vol=.3,type='bandpass',delay=0){ if(!AC) return; const t=AC.currentTime+delay; const s=AC.createBufferSource(); s.buffer=NB; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=.8; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+.02); }

    case 'heavy': noise(.12,500,.6); tone(140,40,.16,'sawtooth',.22); break;
    case 'down': noise(.18,200,.6,'lowpass'); tone(90,35,.2,'sine',.4); break;
    case 'jump': tone(300,620,.12,'square',.08); break;
    case 'land': noise(.06,300,.2,'lowpass'); break;

    case 'special': tone(110,880,.35,'sawtooth',.18); noise(.4,1200,.3); tone(55,55,.4,'sine',.4); break;
    case 'break': noise(.15,1400,.4); noise(.2,400,.3,'lowpass',.03); break;
    case 'phone': tone(1320,1320,.05,'sine',.2); tone(1760,1760,.06,'sine',.2,.06); break;

function basePose(){return{hip:[0,-19],neck:[1,-34],head:[1,-40],bk:[-3,-10],bf:[-4,0],fk:[3,-10],ff:[5,0],be:[-1,-27],bh:[5,-30],fe:[5,-27],fh:[10,-31]};}
function poseFor(e){
  const P=basePose(), t=e.anim||0, s=e.pose||e.state;
  const set=(k,x,y)=>{P[k]=[x,y]};

    case 'walk': { const ph=t*.22, sw=Math.sin(ph)*5, up=Math.abs(Math.sin(ph))>.85?-1:0;
      set('bf',-sw,0);set('ff',sw,0);set('bk',-sw*.5-1,-10+up);set('fk',sw*.5+2,-10+up); P.hip[1]+=up;P.neck[1]+=up;P.head[1]+=up;
      set('bh',5-sw*.4,-30+up);set('fh',10+sw*.4,-31+up); break; }
    case 'jab': set('fe',9,-31);set('fh',18,-31);set('neck',2,-34);set('head',3,-40); break;

    case 'special': set('be',-7,-38);set('bh',-11,-46);set('fe',8,-38);set('fh',12,-46);set('bf',-7,0);set('ff',8,0);set('bk',-5,-10);set('fk',6,-10); break;
    case 'spin': { const a=t*.5; set('fe',Math.cos(a)*9,-30);set('fh',Math.cos(a)*18,-31);set('be',-Math.cos(a)*7,-30);set('bh',-Math.cos(a)*14,-31); break; }
    case 'film': set('neck',3,-33);set('head',5,-38);set('fe',7,-33);set('fh',9,-40);set('be',3,-29);set('bh',8,-35); break;
    case 'zombie': { const b=Math.floor(t/26)%2; set('neck',3,-32+b);set('head',5,-37+b);set('fe',6,-27);set('fh',9,-32+b);set('be',2,-27);set('bh',7,-31+b);

}

function headPainter(e,hx,hy,d,s){
  const pr=(dx,dy,w,h,c)=>{const x=d>0?hx+dx*s:hx-(dx+w)*s+1; R(x,hy+dy*s,w*s,h*s,c);};
  const L=e.look;
  if(L.hairBack) L.hairBack(pr,e);
  pr(-2,-5,5,1,L.skin); pr(-3,-4,7,7,L.skin); pr(-2,3,5,1,L.skin); pr(-3,-4,1,7,shade(L.skin,1.15));
  pr(-3,3,6,1,shade(L.skin,.85));    // jaw shadow
  if(L.lit) pr(1,-3,3,6,'rgba(90,220,255,.38)');
  pr(2,-1,1,1,'#1a0d08');            // eye
  if(L.headFn) L.headFn(pr,e);
}

    spawnT--; const alive=ents.filter(e=>e.team===1&&e.kind==='enemy'&&!e.dead&&e.state!=='dead').length;
    if(wave.queue.length && spawnT<=0 && alive<(wave.boss?4:wave.mini?5:3) && (!wave.boss||wave.late||camX>=LV.len-W-2)){ spawnEnemy(wave.queue.shift()); spawnT=irnd(24,55); }

      else { lockX=Infinity; goT=160; yalla(); mamaCall(); if(wave.music){ G.waveSongDone=1; const a=DECK[deckI]; a.loop=false; } }
      wave=null; waveIdx++;

  }
  // camera
  const target=player.x-W*.42; const maxCam=Math.min(lockX,LV.len-W);

}

  if(LV.amor&&stageState==='play') amorClock();
  if(flashA>0){ ctx.fillStyle='rgba(255,255,255,'+clamp(flashA,0,1)*.7+')'; ctx.fillRect(0,0,W,H); }
  if(!noHud) drawHUD();
  if(goT>0&&frame%40<26){ neonText('YALLA!',W-56,90,'#ffe066',14); text('▶',W-24,104,'#ffe066',16,'center'); }
  if(msg&&(msg.big||msg.small)){ const a=clamp(msg.t/20,0,1); const my=msg.top?34:84; ctx.globalAlpha=a; R(0,my,W,msg.top?34:46,'rgba(0,0,0,.65)'); if(msg.big) chromeText(msg.big,W/2,my+4,msg.top?10:(msg.stage?14:12)); if(msg.small) text(msg.small,W/2,my+(msg.top?22:30),'#ff5fa8',msg.top?6:7,'center'); ctx.globalAlpha=1; }
  if(stageState==='clear'&&G.level===0&&stageT>150){ const a=clamp((stageT-150)/60,0,1); ctx.fillStyle='rgba(20,60,120,'+a*.35+')'; ctx.fillRect(0,0,W,H); R(0,84,W,46,'rgba(0,0,0,.7)'); neonText('EVERYBODY WENT ONLINE...',W/2,100,'#5ff0ff',9); text('...AND NEVER LOOKED UP AGAIN',W/2,114,'#ff5fa8',7,'center'); }
  if(stageState==='clear'&&!(G.level===0&&stageT>150)){ R(0,70,W,80,'rgba(0,0,0,.7)'); chromeText('STAGE CLEAR',W/2,78,18); text('SCORE '+String(Math.round(G.score)).padStart(7,'0'),W/2,108,'#ffe066',8,'center'); text(tr('RARE K7')+' '+COLL.size+'/'+TAPES.length,W/2,138,'#ffe066',6,'center',null); if(G.level>=1) text('MAMA '+Math.round(G.mama)+'%',W/2,147,'#7dff8a',6,'center',null); if(LV.battery) text('WOKE UP: '+G.woke,W/2,124,'#5ff0ff',8,'center'); else text('OFFLINE = THE GOOD LIFE',W/2,124,'#5ff0ff',7,'center'); }
  if(stageState==='clear') drawPosterPeek();
  if(skit) skitDraw();
  if(paused) pauseDraw();
}

/* ---------------- main loop ---------------- */
const SKIPBTN={x:W-118,y:6,w:112,h:24};
function skipIntroOn(){ return scene===SC.intro||(scene===SC.tape&&(tapeName==='intro_cheb'||tapeName==='oran_tape')); }
function drawSkipIntro(){ if(!skipIntroOn()) return; const b=SKIPBTN, on=frame%40<20; ctx.setTransform(S,0,0,S,0,0); R(b.x-2,b.y-2,b.w+4,b.h+4,on?'rgba(255,61,139,.35)':'rgba(255,224,102,.2)'); R(b.x,b.y,b.w,b.h,'#ff3d8b'); R(b.x,b.y+b.h-3,b.w,3,'#a81c5a'); text(tr('SKIP INTRO')+' ▶▶',b.x+b.w/2,b.y+5,'#fff',7,'center','#5a0a2a'); text(tr('Y / TAP'),b.x+b.w/2,b.y+15,'#ffe0f0',5,'center',null); }
let acc=0,last=performance.now();
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ pollPad(); frame++; musicTick(); transTick(); if(!trans) scene.update(); for(const k in pressed) pressed[k]=false; acc-=1000/60; }
  ctx.setTransform(S,0,0,S,0,0); ctx.imageSmoothingEnabled=false; scene.draw(); transDraw(); drawSkipIntro();
  { const a=DECK[deckI]; if(curMusic&&a.src&&a.paused&&(audioBlocked||scene===SC.boot||scene===SC.title||(scene&&scene.isCine))&&frame%40<28){ ctx.setTransform(S,0,0,S,0,0); R(W/2-54,H-12,108,11,'rgba(0,0,0,.7)'); text('♪ TAP FOR SOUND',W/2,H-10,'#ffe066',6,'center'); } }
  // scanlines
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='rgba(0,0,0,.12)'; for(let y=0;y<H*S;y+=S*2) ctx.fillRect(0,y+S,W*S,1);
  requestAnimationFrame(loop);
}
(async function boot(){
  go(SC.boot);
  requestAnimationFrame(t=>{last=t;loop(t);});
  try{ await Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('20px "Bungee"'),document.fonts.load('700 12px "Noto Kufi Arabic"','زومبي')]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  await Promise.all(Object.entries(ASSET_LIST).map(([k,src])=>loadImg(k,src))); imgsReady();
})();
window.__rr={step(n,draw){ for(let i=0;i<n;i++){ frame++; musicTick(); transTick(); if(!trans) scene.update(); for(const k in pressed) pressed[k]=false; if(draw&&i%draw===0){ ctx.setTransform(S,0,0,S,0,0); scene.draw(); transDraw(); } } },
  killAll(){ for(const e of ents){ if(e.kind!=='enemy'||e.team!==1||e.dead) continue; if(e.type==='feed'){ feedHit({x:e.x-10,y:e.y,dir:1,z:0,team:0},e,999,9999); continue; } if(e.state==='grabbed'){ if(player&&player.grab===e) player.grab=null; e.state='hurt'; e.t=0; } if(['fall','down','dead','woke','leave'].includes(e.state)||e.hp<=0) continue; if(e.type==='zombie'){ hurt(e,9,true,player); continue; } e.inv=0; hurt(e,9999,true,player); } },
  get stageState(){ return stageState; }, set held(v){ Object.assign(held,v); }, press(k){ pressed[k]=true; }, get LANG(){ return LANG; }, setLang,
  warp(wi){ ents=ents.filter(e=>e===player||e.kind==='prop'); wave=null; waveIdx=wi; lockX=Infinity; camX=Math.max(0,LV.waves[wi].at-200); player.x=LV.waves[wi].at+5; },setCam(x){camX=x;},get camX(){return camX},get scene(){return scene},SC,go,get G(){return G},get player(){return player},get ents(){return ents},startLevel,newRun,spawn:t=>spawnEnemy(t),skipSkits(){ for(const k in SKITS) SKITS[k].forEach(x=>skitDone.add(x)); skit=null; },setState(v){ stageState=v; if(v==='play'){ DRV=null; player.hide=false; player.x=camX+80; } }};
</script>
